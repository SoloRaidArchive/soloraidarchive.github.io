<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Guide Editor</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/quill/2.0.0-dev.3/quill.snow.min.css" rel="stylesheet">
<style>
  :root{
    --bg1: #ffffff; --bg2: #ffe4c9; --bg3: #f6c9ce;
    --card: #ffffff; --border: #e7edf5;
    --text: #2d3142; --text-muted: #6b7280; --text-dim: #5f6675;
    --blue: #3d9dff; --blue-dark: #2b7fd6; --accent-soft: #eef2ff;
    --shell-bg: #f0f0f2; --editor-bg: #ffffff;
  }
  [data-theme="dark"]{
    --bg1: #0c0e1c; --bg2: #2a1830; --bg3: #6b3324; --bg4: #9c5024;
    --card: #1c2030; --border: #323850;
    --text: #eef1f7; --text-muted: #a7afc0; --text-dim: #767f96;
    --blue: #5aa9ff; --blue-dark: #8cc7ff; --accent-soft: #232840;
    --shell-bg: #10131d; --editor-bg: #1c2030;
  }
  *{ box-sizing: border-box; }
  body{ font-family:'Inter', sans-serif; margin:0; padding:0; background: var(--shell-bg); color: var(--text); }

  .editor-shell{ display:flex; min-height:100vh; }
  .editor-panel{ width:420px; flex-shrink:0; background: var(--editor-bg); border-right:2px solid var(--border); padding:20px; overflow-y:auto; max-height:100vh; }
  @media (max-width: 860px){
    .editor-shell{ flex-direction:column; min-height:0; }
    .editor-panel{ width:100%; max-height:none; border-right:none; border-bottom:2px solid var(--border); }
    .preview-panel{ max-height:none; }
    .field-label{ font-size:12.5px; }
    input[type=text], select, textarea{ font-size:15px; padding:11px 12px; }
    .editor-subtitle{ font-size:13px; }
    .existing-note, .wip-note{ font-size:12.5px; }
    .add-btn{ font-size:15px; padding:13px; }
    .add-party-btn, .add-mon-btn{ font-size:13.5px; }
    .mon-row input{ font-size:13.5px; }
    .strategy-text{ font-size:15px; }
    .strategy-name{ font-size:16px; }
    .strategy-tag{ font-size:11.5px; padding:4px 10px; }
    .battle-mon-level, .battle-mon-meta{ font-size:12.5px; }
    .battle-party-label{ font-size:13.5px; }
    .route-btn{ font-size:13.5px; padding:11px 15px; }
  }
  .editor-title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:2px; }
  .editor-title{ font-family:'Manrope', sans-serif; font-weight:800; font-size:16px; }
  .theme-toggle-btn{
    background: var(--card); border:1.5px solid var(--border); border-radius:8px;
    width:32px; height:32px; cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center;
  }
  .theme-toggle-btn:hover{ border-color: var(--blue); }
  .editor-subtitle{ font-size:12px; color: var(--text-dim); margin-bottom:18px; }
  .field-group{ margin-bottom:16px; }
  .field-label{ font-family:'Manrope', sans-serif; font-weight:700; font-size:11.5px; color: var(--text-dim); text-transform:uppercase; letter-spacing:0.03em; display:block; margin-bottom:5px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field-group{ flex:1; }
  input[type=text], select, textarea{
    width:100%; font-family:'Inter', sans-serif; font-size:13.5px; padding:9px 10px;
    border:1.5px solid var(--border); border-radius:8px; color: var(--text); background:#fff;
  }
  textarea{ resize:vertical; min-height:70px; line-height:1.5; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color: var(--blue); }
  .field-hint{ font-size:10.5px; color: var(--text-dim); margin-top:3px; }
  .add-btn{
    width:100%; margin-top:6px; padding:11px; background: var(--blue); color:#fff; border:none;
    border-radius:9px; font-family:'Manrope', sans-serif; font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .add-btn:hover{ background: var(--blue-dark); }
  .add-btn:disabled{ background:#c9d3e0; cursor:not-allowed; }
  .existing-note{
    background:#fff8e6; border:1.5px solid #ffdb8a; border-radius:10px; padding:10px 12px;
    font-size:11.5px; color:#8a6a1a; margin-bottom:16px; line-height:1.5;
  }
  [data-theme="dark"] .existing-note{ background:#3a2f10; border-color:#6b5a1e; color:#e0c060; }
  .wip-note{
    background:#eef1f5; border:1.5px solid #cfd6e0; border-radius:10px; padding:10px 12px;
    font-size:11.5px; color:#556070; margin-bottom:12px; line-height:1.5;
  }
  [data-theme="dark"] .wip-note{ background:#232840; border-color:#3a4260; color:#a7afc0; }
  [data-theme="dark"] .mon-remove-btn{ color:#5a5f6e; }
  hr.section-divider{ border:none; border-top:1.5px solid var(--border); margin:20px 0; }

  .party-card{ border:1.5px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px; background:#fafbfc; }
  .party-card-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .party-card-head input{ flex:1; }
  .party-remove-btn{ background:none; border:none; color:#c62828; font-size:16px; cursor:pointer; padding:2px 6px; flex-shrink:0; }
  .mon-block{ margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--border); }
  .mon-block:last-child{ border-bottom:none; margin-bottom:0; }
  .mon-row{ display:flex; gap:6px; margin-bottom:6px; align-items:center; }
  .mon-row:last-child{ margin-bottom:0; }
  .mon-row input{ font-size:12px; padding:7px 8px; }
  .mon-row .mon-name{ flex:2; }
  .mon-row .mon-level{ flex:0.7; }
  .mon-moves-row .mon-fm, .mon-moves-row .mon-cm, .mon-moves-row .mon-cm2{ flex:1; }
  .mon-remove-btn{ background:none; border:none; color:#b0b0b8; font-size:14px; cursor:pointer; flex-shrink:0; padding:2px 4px; }
  .mon-remove-btn:hover{ color:#c62828; }
  .add-mon-btn{
    width:100%; padding:7px; background:#fff; border:1.5px dashed var(--border); border-radius:7px;
    font-family:'Inter', sans-serif; font-weight:600; font-size:11.5px; color: var(--blue-dark); cursor:pointer; margin-top:2px;
  }
  .add-mon-btn:hover{ border-color: var(--blue); }
  .add-party-btn{
    width:100%; padding:10px; background:#fff; border:1.5px dashed var(--blue); border-radius:9px;
    font-family:'Manrope', sans-serif; font-weight:700; font-size:12.5px; color: var(--blue-dark); cursor:pointer;
  }
  .add-party-btn:hover{ background: var(--accent-soft); }

  .preview-panel{ flex:1; overflow-y:auto; max-height:100vh; background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%); }
  .preview-inner{ max-width:640px; margin:0 auto; padding:24px 24px 60px; }
  .preview-context{
    display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:20px;
    font-family:'Manrope', sans-serif; font-weight:700; font-size:12.5px; color: var(--blue-dark);
    background: var(--card); border:1.5px solid var(--border); border-radius:999px; padding:8px 16px; width:fit-content; margin-left:auto; margin-right:auto;
  }
  .section-title{ font-family:'Manrope', sans-serif; font-weight:800; font-size:17px; margin:22px 0 4px; display:flex; align-items:center; gap:8px; }
  .section-num{ width:22px; height:22px; border-radius:50%; background: var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; }
  .strategy-block{ margin:12px 0; padding-bottom:14px; border-bottom:1px solid var(--border); }
  .strategy-name{ font-family:'Manrope', sans-serif; font-weight:800; font-size:15px; margin-bottom:4px; }
  .strategy-tags{ display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
  .strategy-tag{ font-family:'Inter',sans-serif; font-weight:700; font-size:10px; color: var(--blue-dark); background: var(--accent-soft); padding:2px 8px; border-radius:999px; }
  .strategy-text{ font-size:13.5px; color: var(--text); line-height:1.7; }
  .strategy-text p{ margin:0 0 8px; }
  .strategy-text h2{ font-family:'Manrope', sans-serif; font-weight:800; font-size:16px; margin:14px 0 6px; }
  .strategy-text h3{ font-family:'Manrope', sans-serif; font-weight:700; font-size:14px; margin:12px 0 5px; }
  .strategy-text blockquote{ margin:8px 0; padding:6px 12px; border-left:3px solid var(--blue); color: var(--text-dim); }
  .strategy-text ol, .strategy-text ul{ margin:4px 0 8px; padding-left:22px; }
  .strategy-text img{ max-width:100%; border-radius:8px; margin:6px 0; }
  .strategy-text strong{ font-weight:800; }
  .strategy-text.placeholder{ color: var(--text-dim); font-style:italic; }
  .strategy-vod{ display:inline-block; font-size:12.5px; font-weight:700; color: var(--blue-dark); text-decoration:none; margin-top:4px; }

  .battle-party{ background:#fff; border:1.5px solid var(--border); border-radius:12px; padding:12px 14px; margin-top:10px; }
  .battle-party-label{ font-family:'Manrope', sans-serif; font-weight:800; font-size:12.5px; color: var(--blue-dark); margin-bottom:8px; }
  .battle-mon{ display:flex; align-items:center; gap:8px; padding:5px 0; font-size:12px; }
  .battle-mon-icon{ width:26px; height:26px; border-radius:50%; background: var(--accent-soft); flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .battle-mon-icon img{ width:100%; height:100%; object-fit:contain; }
  .battle-mon-level{ font-weight:700; font-size:11px; color: var(--text); }
  .battle-mon-meta{ color: var(--text-dim); font-size:11px; }

  .route-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .route-btn{
    font-family:'Manrope', sans-serif; font-weight:700; font-size:12px;
    background: var(--card); color: var(--text-dim); border:1.5px solid var(--border);
    padding:9px 14px; border-radius:999px; cursor:pointer;
  }
  .route-btn.active{ background: var(--blue); color:#fff; border-color: var(--blue); }
  [data-theme="dark"] .ql-toolbar.ql-snow{ border-color: var(--border); background: var(--card); }
  [data-theme="dark"] .ql-container.ql-snow{ border-color: var(--border); }
  [data-theme="dark"] .ql-editor{ color: var(--text); }
  [data-theme="dark"] .ql-editor.ql-blank::before{ color: var(--text-dim); }
  [data-theme="dark"] .ql-snow .ql-stroke{ stroke: var(--text-dim); }
  [data-theme="dark"] .ql-snow .ql-fill{ fill: var(--text-dim); }
  [data-theme="dark"] .ql-snow .ql-picker{ color: var(--text-dim); }
  [data-theme="dark"] .ql-snow .ql-picker-options{ background: var(--card); border-color: var(--border); }
  [data-theme="dark"] .ql-snow.ql-toolbar button:hover .ql-stroke,
  [data-theme="dark"] .ql-snow .ql-toolbar button:hover .ql-stroke{ stroke: var(--blue); }
</style>
</head>
<body>

<div class="editor-shell">
  <div class="editor-panel">
    <div class="editor-title-row">
      <div class="editor-title">Add a strategy</div>
      <button type="button" class="theme-toggle-btn" id="themeToggle" title="Toggle dark mode">🌙</button>
    </div>
    <div class="editor-subtitle">Changes appear live on the right as you type</div>

    <div class="wip-note">⚠️ Requires a GitHub account to submit. This editor is still being updated - some things may change.</div>

    <div class="existing-note">New strategies are added to this boss's guide page - not a separate page.</div>

    <div class="field-group">
      <label class="field-label">Boss</label>
      <select id="f-boss">
        <option value="" disabled selected>Loading bosses...</option>
      </select>
    </div>
    <div class="field-group" id="new-boss-row" style="display:none;">
      <label class="field-label">New boss name</label>
      <input type="text" id="f-boss-new" placeholder="e.g. Xerneas">
    </div>

    <div class="field-group">
      <label class="field-label">Strategy name</label>
      <input type="text" id="f-strategy-name" placeholder="e.g. Ground Duo">
    </div>

    <div class="field-row">
      <div class="field-group">
        <label class="field-label">Weather</label>
        <select id="f-weather">
          <option>Extreme</option><option>Sunny</option><option>Rainy</option>
          <option>Partly Cloudy</option><option>Windy</option><option>Snow</option><option>Fog</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label">Difficulty</label>
        <select id="f-difficulty">
          <option>3&#9733;</option><option>4&#9733;</option><option>5&#9733;</option><option>5.5&#9733;</option><option>6&#9733;</option>
        </select>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">Adventure Effect</label>
      <select id="f-ae">
        <option>None</option><option>Blade Boost</option><option>Shield Boost</option>
      </select>
    </div>

    <div class="field-group">
      <label class="field-label">Strategy text</label>
      <div id="f-text-editor"></div>
    </div>

    <div class="field-group">
      <label class="field-label">VOD link</label>
      <input type="text" id="f-vod" placeholder="https://youtu.be/...">
    </div>

    <div class="field-group">
      <label class="field-label">Your name (credit)</label>
      <input type="text" id="f-name" placeholder="Spiritedbloom">
    </div>

    <hr class="section-divider">

    <div class="field-group">
      <label class="field-label">Battle Parties</label>
      <div id="parties-list"></div>
      <button type="button" class="add-party-btn" onclick="addParty()">+ Add Battle Party</button>
    </div>

    <button class="add-btn" id="submit-btn" onclick="addStrategy()" disabled>Submit for review</button>
    <div id="submit-status" style="font-size:12px; margin-top:10px; line-height:1.5;"></div>
  </div>

  <div class="preview-panel">
    <div class="preview-inner">
      <div class="preview-context">📖 Guide: <span id="p-boss">Select a boss</span></div>

      <div class="section-title"><span class="section-num">3</span>Strategy</div>
      <div class="route-row" id="preview-route-row"></div>
      <div id="preview-strategy-display"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/2.0.0-dev.3/quill.min.js"></script>

function toDbSlug(name){
  let n = name.trim().toLowerCase();
  if (DB_OVERRIDES[n]) return DB_OVERRIDES[n];
  n = n.replace(/^shadow\s+/, "");
  if (DB_OVERRIDES[n]) return DB_OVERRIDES[n];
  const megaMatch = n.match(/^mega\s+(.+)$/);
  if (megaMatch) return `${megaMatch[1].replace(/\s+/g, "-")}-mega`;
  const regionalMatch = n.match(/^(alolan|galarian|hisuian|paldean)\s+(.+)$/);
  if (regionalMatch) return `${regionalMatch[2].replace(/\s+/g, "-")}-${regionalMatch[1]}`;
  return n.replace(/\s+/g, "-");
}

  "tapu koko": "tapukoko", "tapu lele": "tapulele", "tapu bulu": "tapubulu", "tapu fini": "tapufini",
  "necrozma dusk mane": "necrozma-duskmane", "ndm": "necrozma-duskmane",
  "necrozma dawn wings": "necrozma-dawnwings",
  "mega charizard x": "charizard-megax", "mega charizard y": "charizard-megay",
  "mega mewtwo x": "mewtwo-megax", "mega mewtwo y": "mewtwo-megay",
  "ho-oh": "hooh",
  "calyrex shadow rider": "calyrex-shadowrider", "calyrex ice rider": "calyrex-icerider",
  "zygarde 10%": "zygarde-tenpercent",
  "zygarde 50%": "zygarde-fiftypercent",
  "landorus i": "landorus-incarnate", "landorus-t": "landorus-therian",
  "thundurus i": "thundurus-incarnate", "thundurus t": "thundurus-therian",
  "tornadus i": "tornadus-incarnate", "tornadus t": "tornadus-therian",
};
const ANI_URL_OVERRIDES = {
  "palkia origin": "https://raw.githubusercontent.com/mgrann03/pokemon-resources/main/graphics/pogo-256/palkia-origin.png",
  "dialga origin": "https://raw.githubusercontent.com/mgrann03/pokemon-resources/main/graphics/pogo-256/dialga-origin.png",
};
const LOCAL_SPRITES = new Set(["abomasnow-mega", "absol-mega", "aerodactyl-mega", "aggron-mega", "alakazam-mega", "altaria-mega", "ampharos-mega", "articuno", "audino-mega", "azelf", "banette-mega", "baxcalibur", "beedrill-mega", "blacephalon", "blastoise-mega", "blaziken", "blaziken-mega", "buzzwole", "camerupt-mega", "celesteela", "charizard-megax", "charizard-megay", "darkrai", "deoxys", "deoxys-attack", "dialga", "diancie-mega", "enamorus-incarnate", "enamorus-therian", "entei", "eternatus", "excadrill", "gallade-mega", "garchomp", "garchomp-mega", "gardevoir-mega", "genesect", "gengar", "gengar-mega", "giratina-altered", "giratina-origin", "glalie-mega", "groudon", "groudon-primal", "guzzlord", "gyarados-mega", "heatran", "heracross-mega", "hooh", "houndoom-mega", "kangaskhan-mega", "kartana", "keldeo", "keldeo-resolute", "kyogre", "kyogre-primal", "kyurem", "kyurem-black", "kyurem-white", "landorus-incarnate", "landorus-therian", "latios", "lopunny-mega", "lucario-mega", "mamoswine", "manectric-mega", "mawile-mega", "medicham-mega", "metagross-mega", "mewtwo", "mewtwo-megay", "necrozma", "necrozma-dawnwings", "necrozma-duskmane", "nihilego", "palkia", "pheromosa", "pidgeot-mega", "pinsir-mega", "rampardos", "rayquaza-mega", "regidrago", "regieleki", "regigigas", "reshiram", "rhyperior", "sableye-mega", "salamence", "salamence-mega", "sceptile-mega", "scizor-mega", "sharpedo-mega", "slowbro-mega", "solgaleo", "stakataka", "steelix-mega", "swampert-mega", "tapubulu", "tapukoko", "tapulele", "terrakion", "thundurus-incarnate", "thundurus-therian", "tornadus-incarnate", "tornadus-therian", "tyranitar-mega", "tyrantrum", "venusaur-mega", "virizion", "xerneas", "xurkitree", "yveltal", "zacian-crownedsword", "zamazenta-crownedshield", "zamazenta-hero", "zapdos", "zekrom"]);
function monSpriteUrl(name){
  const key = name.trim().toLowerCase();
  if (GOHUB_OVERRIDES[key]) return GOHUB_OVERRIDES[key];
  if (ANI_URL_OVERRIDES[key]) return ANI_URL_OVERRIDES[key];
  if (key.startsWith("shadow ")){
    const base = key.replace(/^shadow\s+/, "");
    if (DEX_MAP[base]) return `https://db.pokemongohub.net/images/official/full/${DEX_MAP[base]}_shadow.webp`;
  }
  const slug = (ANI_OVERRIDES[key] || ANI_OVERRIDES[key.replace(/^shadow\s+/, "")] || toDbSlug(name)).replace(/-alolan$/, "-alola");
  if (LOCAL_SPRITES.has(slug)) return `assets/sprites/${slug}.gif`;
  return `https://raw.githubusercontent.com/mgrann03/pokemon-resources/main/graphics/ani/${slug}.gif`;
}

function slugify(name){
  return name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}
function currentBossName(){
  if(bossEl.value === "__new__") return newBossEl.value.trim();
  return bossEl.value;
}

async function loadBossIndex(){
  try{
    const res = await fetch('data/guides/index.json');
    const data = res.ok ? await res.json() : { bosses: [] };
    bossEl.innerHTML =
      `<option value="" disabled selected>Choose a boss...</option>` +
      data.bosses.map(b => `<option value="${b.name}">${b.name}</option>`).join('') +
      `<option value="__new__">+ Add a new boss</option>`;
  }catch(e){
    bossEl.innerHTML = `<option value="__new__" selected>+ Add a new boss</option>`;
  }
}
// ============ SHARED RENDERING (identical to lunala.html's strategyBlockHtml) ============
// Using the exact same function/markup as the real guide page is what guarantees this preview
// can never visually drift from what volunteers actually get once merged - it's not a separate
// approximation to keep in sync by hand.
function strategyBlockHtml(s){
  return `
    <div class="strategy-block">
      ${s.strategyName ? `<div class="strategy-name">${s.strategyName}</div>` : ""}
      <div class="strategy-tags">
        <span class="strategy-tag">${s.difficulty}</span>
        <span class="strategy-tag">${s.weather}</span>
        ${s.adventureEffect && s.adventureEffect !== "None" ? `<span class="strategy-tag">${s.adventureEffect}</span>` : ""}
      </div>
      <div class="strategy-text${s.isPlaceholder ? " placeholder" : ""}">${s.text}</div>
      ${s.vod ? `<a class="strategy-vod" href="${s.vod}" target="_blank" rel="noopener noreferrer">Watch VOD &rarr;</a>` : ""}
      ${(s.battleParties && s.battleParties.length > 0) ? s.battleParties.map(p => `
        <div class="battle-party">
          <div class="battle-party-label">${p.label}</div>
          ${p.mons.map(m => `
            <div class="battle-mon">
              <div class="battle-mon-icon"><img src="${monSpriteUrl(m.name)}" alt="" onerror="this.remove();"></div>
              <div>
                ${m.level ? `<div class="battle-mon-level">Lv ${m.level}</div>` : ""}
                ${(m.fm || m.cm || m.cm2) ? `<div class="battle-mon-meta">${[m.fm, m.cm, m.cm2].filter(Boolean).join(' / ')}</div>` : ""}
              </div>
            </div>
          `).join('')}
        </div>
      `).join('') : ""}
      ${s.submittedBy ? `<div class="strategy-credit">Submitted by ${s.submittedBy}</div>` : ""}
    </div>
  `;
}

let existingStrategies = [];
function currentLiveStrategy(){
  return {
    strategyName: nameFieldEl.value.trim(),
    difficulty: diffEl.value,
    weather: weatherEl.value,
    adventureEffect: aeEl.value,
    text: quill.getText().trim() ? quill.root.innerHTML : "Start typing to see your strategy appear here...",
    isPlaceholder: !quill.getText().trim(),
    vod: vodEl.value.trim(),
    battleParties: collectParties(),
  };
}
function renderRouteTabs(){
  const row = document.getElementById('preview-route-row');
  const tabs = existingStrategies.map((s, i) => {
    const parts = [s.difficulty, s.weather];
    if(s.adventureEffect && s.adventureEffect !== "None") parts.push(s.adventureEffect);
    return `<button type="button" class="route-btn" onclick="selectPreviewRoute(${i})">${parts.join(" \u00b7 ")}</button>`;
  });
  tabs.push(`<button type="button" class="route-btn active" onclick="selectPreviewRoute('live')">Your draft</button>`);
  row.innerHTML = tabs.join('');
}
function selectPreviewRoute(which){
  document.querySelectorAll('#preview-route-row .route-btn').forEach(btn => btn.classList.remove('active'));
  const display = document.getElementById('preview-strategy-display');
  if(which === 'live'){
    document.querySelector('#preview-route-row .route-btn:last-child').classList.add('active');
    display.innerHTML = strategyBlockHtml(currentLiveStrategy());
  }else{
    document.querySelectorAll('#preview-route-row .route-btn')[which].classList.add('active');
    display.innerHTML = strategyBlockHtml(existingStrategies[which]);
  }
}

async function onBossChange(){
  const pBoss = document.getElementById('p-boss');

  if(bossEl.value === "__new__"){
    newBossRow.style.display = "block";
    existingStrategies = [];
    renderRouteTabs();
    selectPreviewRoute('live');
    pBoss.textContent = "(new boss)";
    submitBtn.disabled = true;
    return;
  }
  newBossRow.style.display = "none";
  const boss = bossEl.value;
  pBoss.textContent = boss;
  submitBtn.disabled = false;

  try{
    const res = await fetch(`data/guides/${slugify(boss)}.json`);
    if(!res.ok) throw new Error("not found");
    const data = await res.json();
    existingStrategies = data.strategies || [];
  }catch(e){
    existingStrategies = [];
  }
  renderRouteTabs();
  selectPreviewRoute('live');
}
bossEl.addEventListener('change', onBossChange);
newBossEl.addEventListener('input', () => {
  document.getElementById('p-boss').textContent = newBossEl.value.trim() || "(new boss)";
  submitBtn.disabled = !newBossEl.value.trim();
});

let partyCounter = 0;
function addParty(){
  partyCounter++;
  const id = partyCounter;
  const el = document.createElement('div');
  el.className = 'party-card';
  el.dataset.partyId = id;
  el.innerHTML = `
    <div class="party-card-head">
      <input type="text" class="party-label" placeholder="Lobby / party label (e.g. Lobby 1, Windy Only)">
      <button type="button" class="party-remove-btn" onclick="removeParty(${id})">&times;</button>
    </div>
    <div class="mon-list" id="mon-list-${id}"></div>
    <button type="button" class="add-mon-btn" onclick="addMon(${id})">+ Add Pok&eacute;mon</button>
  `;
  document.getElementById('parties-list').appendChild(el);
  addMon(id);
  syncPreview();
}
function removeParty(id){
  document.querySelector(`.party-card[data-party-id="${id}"]`)?.remove();
  syncPreview();
}
function addMon(partyId){
  const list = document.getElementById(`mon-list-${partyId}`);
  const row = document.createElement('div');
  row.className = 'mon-block';
  row.innerHTML = `
    <div class="mon-row">
      <input type="text" class="mon-name" placeholder="Pok&eacute;mon">
      <input type="text" class="mon-level" placeholder="Lv">
      <button type="button" class="mon-remove-btn" onclick="this.closest('.mon-block').remove(); syncPreview();">&times;</button>
    </div>
    <div class="mon-row mon-moves-row">
      <input type="text" class="mon-fm" placeholder="Fast move">
      <input type="text" class="mon-cm" placeholder="Charge move 1">
      <input type="text" class="mon-cm2" placeholder="Charge move 2 (optional)">
    </div>
  `;
  list.appendChild(row);
  row.querySelectorAll('input').forEach(inp => inp.addEventListener('input', syncPreview));
  syncPreview();
}
function collectParties(){
  return Array.from(document.querySelectorAll('.party-card')).map(card => {
    const label = card.querySelector('.party-label').value.trim() || "Unlabeled party";
    const mons = Array.from(card.querySelectorAll('.mon-block')).map(block => ({
      name: block.querySelector('.mon-name').value.trim(),
      level: block.querySelector('.mon-level').value.trim(),
      fm: block.querySelector('.mon-fm').value.trim(),
      cm: block.querySelector('.mon-cm').value.trim(),
      cm2: block.querySelector('.mon-cm2').value.trim(),
    })).filter(m => m.name);
    return { label, mons };
  }).filter(p => p.mons.length > 0);
}

function syncPreview(){
  // only re-render if the "Your draft" tab is the one currently active - editing shouldn't
  // yank the volunteer away from a different route tab they clicked over to compare against
  const activeTab = document.querySelector('#preview-route-row .route-btn.active');
  if(activeTab && activeTab === document.querySelector('#preview-route-row .route-btn:last-child')){
    document.getElementById('preview-strategy-display').innerHTML = strategyBlockHtml(currentLiveStrategy());
  }
}
[weatherEl, aeEl, diffEl, vodEl, nameFieldEl].forEach(el => el.addEventListener('input', syncPreview));
quill.on('text-change', syncPreview);

const WORKER_URL = "https://guide-submissions.solo-raid-archive.workers.dev";

async function addStrategy(){
  const boss = currentBossName();
  if(!boss){ alert('Choose or enter a boss first.'); return; }
  if(!quill.getText().trim()){ alert('Add strategy text first.'); return; }
  const status = document.getElementById('submit-status');
  const nameEl = document.getElementById('f-name');

  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting...";
  status.textContent = "";

  const payload = {
    boss: boss,
    strategyName: nameFieldEl.value.trim(),
    weather: weatherEl.value,
    adventureEffect: aeEl.value,
    difficulty: diffEl.value,
    text: quill.root.innerHTML,
    vod: vodEl.value.trim(),
    submittedBy: nameEl.value.trim() || "Anonymous",
    battleParties: collectParties(),
  };

  try{
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if(!res.ok || !data.ok) throw new Error(data.error || `Request failed (${res.status})`);

    status.innerHTML = `Submitted! <a href="${data.prUrl}" target="_blank" rel="noopener noreferrer" style="color:var(--blue-dark); font-weight:700;">View the pull request &rarr;</a><br>A maintainer will review it before it goes live.`;
    status.style.color = "#1f9d5c";

    existingStrategies.push({
      strategyName: nameFieldEl.value.trim() ? `${nameFieldEl.value.trim()} (Pending review)` : "Pending review",
      difficulty: diffEl.value,
      weather: weatherEl.value,
      adventureEffect: aeEl.value,
      text: quill.root.innerHTML,
      vod: vodEl.value.trim(),
      battleParties: collectParties(),
    });
    renderRouteTabs();
    selectPreviewRoute(existingStrategies.length - 1);
    quill.setText(""); vodEl.value = ""; nameFieldEl.value = "";
    document.querySelectorAll('.party-card').forEach(c => c.remove());
  }catch(e){
    status.textContent = `Couldn't submit: ${e.message}`;
    status.style.color = "#c62828";
  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit for review";
  }
}

syncPreview();
loadBossIndex();

const themeToggle = document.getElementById("themeToggle");
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
  try{ localStorage.setItem("raidArchiveTheme", theme); }catch(e){}
}
themeToggle.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  applyTheme(current === "dark" ? "light" : "dark");
});
let initialTheme = "light";
try{
  const saved = localStorage.getItem("raidArchiveTheme");
  if(saved){ initialTheme = saved; }
  else if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches){ initialTheme = "dark"; }
}catch(e){}
applyTheme(initialTheme);
</script>
